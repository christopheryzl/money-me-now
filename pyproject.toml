[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-me-now"
version = "0.1.0"
description = "Practice quantitative trading bot"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scan = "bot.scanner:main"

[tool.setuptools.packages.find]
where = ["src"]
